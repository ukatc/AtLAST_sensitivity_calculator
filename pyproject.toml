[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlast_sc*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yaml"]

[project]
name = "atlast_sc"
version = "2.0.0-alpha.3"
authors = [
    { name="Joanna Ramasawmy", email="joanna.ramasawmy@stfc.ac.uk" },
    { name="Fiona Kirton", email="fiona.kirton@gmail.com"},
    { name="Ilgin Okan", email="ilgin.okan@stfc.ac.uk"}
]
description = "AtLAST sensitivity calculator"
#license = "MIT"
requires-python = ">=3.10,<3.14"

dependencies = [
    "astropy >=7.0,<8",
    "numpy >=2.1,<3",
    "scipy >=1.14,<2",
    "pyyaml >=6.0,<7",
    "pydantic >=2.12,<3"
]

[project.urls]
repository="https://github.com/ukatc/AtLAST_sensitivity_calculator"
