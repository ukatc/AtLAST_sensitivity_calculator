name: Lint and test Python package

on: [push]

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    #- name: Add conda to system path
    #  run: |
    #    # $CONDA is an environment variable pointing to the root of the miniconda directory
    #    echo $CONDA/bin >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        conda install -y python=3.13
        echo $CONDA/bin >> $GITHUB_PATH
        conda env update --file environment.yml --name base
    - name: Run focused Calculator reset test
      env:
        ATLAST_TIME_ATMOSPHERE_TABLE_READS: "1"
      run: |
        pytest atlast_sc_tests/unit_tests/test_calculator.py::TestCalculator::test_reset -s -vv --durations=10
    - name: Profile focused Calculator reset test
      run: |
        python -m cProfile -s cumulative -m pytest -q atlast_sc_tests/unit_tests/test_calculator.py::TestCalculator::test_reset
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run python package tests and coverage report
      env:
        ATLAST_TIME_ATMOSPHERE_TABLE_READS: "1"
      run: |
        coverage run -m pytest atlast_sc_tests -s -vv --durations=25
        coverage report -m
    - name: Run FastAPI tests and coverage report
      env:
        ATLAST_TIME_ATMOSPHERE_TABLE_READS: "1"
      run: |
        coverage run -m pytest fastapi_tests -s -vv --durations=25
        coverage report -m --omit=atlast_sc/*        
